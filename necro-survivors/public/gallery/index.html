<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>목적을 잃지 않는 사령군주 : 서바이버즈 — 버전 비교 &amp; 통합 도감 갤러리</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/NeoDunggeunmo.css" />
  <style>
    :root {
      --bg-dark: #0c0908;
      --bg-panel: #18120e;
      --bg-card: #231b15;
      --border-wood: #543b28;
      --border-brass: #d4a338;
      --neon-gold: #ffd000;
      --neon-cyan: #00f0ff;
      --neon-green: #00ffaa;
      --neon-purple: #c850ff;
      --neon-pink: #ff2a6d;
      --neon-orange: #ff7722;
      --text-ivory: #f5ede2;
      --text-muted: #b8a692;
      --font-pixel: 'NeoDunggeunmo', monospace, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 10%, #201712 0%, #0c0908 100%);
      color: var(--text-ivory);
      font-family: var(--font-pixel);
      min-height: 100vh;
      padding: 20px;
      line-height: 1.5;
    }
    .container { max-width: 1360px; margin: 0 auto; }
    .header {
      background: var(--bg-panel);
      border: 2px solid var(--border-brass);
      box-shadow: 0 0 24px rgba(212, 163, 56, 0.25);
      padding: 18px 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .hero-thumb {
      width: 64px; height: 64px;
      image-rendering: pixelated;
      object-fit: contain;
      background: #100c09;
      border: 2px solid var(--border-wood);
      padding: 4px;
    }
    .header h1 { color: var(--neon-gold); font-size: 1.4rem; margin-bottom: 4px; }
    .header p { color: var(--text-muted); font-size: 0.88rem; }
    .play-btn {
      text-decoration: none;
      background: linear-gradient(180deg, #3a2a16, #24190d);
      color: var(--neon-gold);
      border: 2px solid var(--neon-gold);
      padding: 10px 20px;
      font-size: 0.95rem;
      box-shadow: 0 0 14px rgba(255, 208, 0, 0.35);
      display: inline-block;
    }
    .play-btn:hover { background: #47341b; }

    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .tab-btn {
      background: var(--bg-panel);
      color: var(--text-muted);
      border: 2px solid var(--border-wood);
      padding: 10px 16px;
      font-family: var(--font-pixel);
      font-size: 0.92rem;
      cursor: pointer;
    }
    .tab-btn:hover { border-color: var(--border-brass); color: var(--text-ivory); }
    .tab-btn.active {
      background: #2b2016;
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
    }

    .panel {
      background: var(--bg-panel);
      border: 2px solid var(--border-wood);
      padding: 20px;
    }
    .section-title {
      color: var(--neon-gold);
      font-size: 1.1rem;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border-wood);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* 비교 그리드 */
    .compare-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .compare-card {
      background: var(--bg-card);
      border: 2px solid var(--border-wood);
      padding: 14px;
    }
    .compare-title {
      color: var(--neon-gold);
      font-size: 0.96rem;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .compare-sub { color: var(--text-muted); font-size: 0.76rem; }
    .compare-boxes {
      display: grid;
      grid-template-columns: 1fr 24px 1fr;
      align-items: center;
      gap: 8px;
    }
    .compare-side {
      background: #140f0c;
      border: 1px solid #3f2d20;
      padding: 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .compare-side.new {
      border-color: var(--neon-green);
      background: #101b17;
    }
    .compare-side.old {
      border-color: #6b5344;
    }
    .badge-old {
      font-size: 0.72rem;
      color: #c8b6a6;
      background: #2b211b;
      padding: 2px 8px;
      border: 1px solid #5a4638;
    }
    .badge-new {
      font-size: 0.72rem;
      color: var(--neon-green);
      background: #102a20;
      padding: 2px 8px;
      border: 1px solid var(--neon-green);
    }
    .compare-img {
      width: 72px; height: 72px;
      image-rendering: pixelated;
      object-fit: contain;
    }
    .compare-arrow {
      text-align: center;
      color: var(--neon-gold);
      font-size: 1.1rem;
    }
    .vfx-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }
    .vfx-row img {
      width: 56px; height: 56px;
      image-rendering: pixelated;
      object-fit: contain;
      background: #0c0806;
      border: 1px solid #3a2a1e;
      padding: 2px;
    }

    /* 10개 계열 트리 */
    .branch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(560px, 1fr));
      gap: 14px;
    }
    @media (max-width: 640px) { .branch-grid { grid-template-columns: 1fr; } }
    .branch-card { background: var(--bg-card); border: 2px solid var(--border-wood); padding: 14px; }
    .branch-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .branch-name { color: var(--neon-green); font-size: 1.02rem; }
    .branch-tag { font-size: 0.78rem; padding: 2px 8px; border: 1px solid var(--border-brass); color: var(--neon-gold); }
    .tree-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .skill-mini {
      background: #17110d; border: 1px solid var(--border-wood); padding: 10px; cursor: pointer;
      display: flex; flex-direction: column; gap: 6px;
    }
    .skill-mini:hover { border-color: var(--neon-cyan); background: #221914; }
    .skill-mini-top { display: flex; align-items: center; gap: 8px; }
    .skill-icon {
      width: 40px; height: 40px; image-rendering: pixelated; object-fit: contain;
      background: #0d0907; border: 1px solid #3f2d20; padding: 2px; flex-shrink: 0;
    }
    .skill-title { font-size: 0.86rem; color: var(--text-ivory); }
    .skill-sub { font-size: 0.74rem; color: var(--text-muted); }
    .awakened-strip {
      margin-top: 8px; padding-top: 8px; border-top: 1px dashed #3f2d20;
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .awk-pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: #1b1220; border: 1px solid var(--neon-purple);
      padding: 4px 10px; font-size: 0.8rem; color: #ebb5ff; cursor: pointer;
    }
    .awk-pill img { width: 22px; height: 22px; image-rendering: pixelated; object-fit: contain; }

    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .item-card { background: var(--bg-card); border: 2px solid var(--border-wood); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .item-card-head { display: flex; align-items: center; gap: 10px; }
    .item-card img.sprite {
      width: 52px; height: 52px; image-rendering: pixelated; object-fit: contain;
      background: #110c09; border: 1px solid #3f2d20; padding: 3px;
    }
    .item-name { color: var(--neon-gold); font-size: 0.94rem; }
    .item-meta { color: var(--neon-cyan); font-size: 0.78rem; }
    .item-desc { color: var(--text-muted); font-size: 0.8rem; }

    .region-card { background: var(--bg-card); border: 2px solid var(--border-wood); padding: 14px; margin-bottom: 14px; }
    .region-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
    .region-bgs { display: flex; gap: 8px; align-items: center; }
    .region-bgs img { height: 54px; width: 96px; object-fit: cover; image-rendering: pixelated; border: 1px solid var(--border-brass); }
    .monster-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
    .monster-box { background: #15100c; border: 1px solid #3f2d20; padding: 8px; text-align: center; }
    .monster-box.named { border-color: var(--neon-orange); }
    .monster-box.boss { border-color: var(--neon-pink); background: #211015; }
    .monster-box img { width: 56px; height: 56px; image-rendering: pixelated; object-fit: contain; margin-bottom: 4px; }
    .monster-role { font-size: 0.7rem; color: var(--text-muted); }
    .monster-name { font-size: 0.8rem; color: var(--text-ivory); }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.78);
      display: none; justify-content: center; align-items: center; padding: 20px; z-index: 100;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--bg-panel); border: 2px solid var(--neon-gold);
      max-width: 620px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 20px;
    }
    .modal-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; border-bottom: 1px solid var(--border-wood); padding-bottom: 10px;
    }
    .close-btn {
      background: #2b1818; color: var(--neon-pink); border: 1px solid var(--neon-pink);
      padding: 4px 10px; font-family: var(--font-pixel); cursor: pointer;
    }
    .lv-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.8rem; }
    .lv-table th, .lv-table td { border: 1px solid #3f2d20; padding: 6px 8px; text-align: left; }
    .lv-table th { background: #241b14; color: var(--neon-gold); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <img class="hero-thumb" src="../assets/agents/agent_male_nemesis.png" alt="사령군주 최미남" />
        <div>
          <h1>💀 목적을 잃지 않는 사령군주 : 서바이버즈 — 버전 비교 &amp; 도감</h1>
          <p>구버전 에셋 vs 신규 제작 에셋 실시간 비교 · 10개 스킬 계열 · 소환수 5종 · 14지역 84종 괴수</p>
        </div>
      </div>
      <a href="/" class="play-btn">🎮 현재 운영 버전 플레이 ▶</a>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="compare">🔄 구버전 vs 신규 에셋 비교</button>
      <button class="tab-btn" data-tab="branches">⚔️ 10개 스킬 계열 트리</button>
      <button class="tab-btn" data-tab="passives">💎 패시브 &amp; 각성 전체</button>
      <button class="tab-btn" data-tab="regions">🗺️ 14개 지역 &amp; 84종 괴수</button>
      <button class="tab-btn" data-tab="altar">🕯️ 영혼 각인 제단</button>
    </div>

    <div class="panel" id="contentPanel"></div>
  </div>

  <div class="modal-backdrop" id="skillModal">
    <div class="modal">
      <div class="modal-head">
        <div style="display:flex; align-items:center; gap:10px;">
          <img id="modalIcon" class="skill-icon" src="" alt="" />
          <div>
            <div id="modalTitle" style="color:var(--neon-gold); font-size:1.05rem;"></div>
            <div id="modalMeta" style="color:var(--neon-cyan); font-size:0.78rem;"></div>
          </div>
        </div>
        <button class="close-btn" id="closeModal">닫기 ✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="gallery_data.js"></script>
  <script>
    const D = window.GALLERY_DATA;
    const byId = new Map();
    [...D.activeSkills, ...D.passiveSkills, ...D.awakenedSkills].forEach(s => byId.set(s.id, s));

    const MINION_COMPARES = [
      { name: '해골 전사', oldPath: 'legacy/summons/minion_skeleton_warrior.png', newPath: '../assets/summons/minion_skeleton_warrior.png', note: '신규 도트 스프라이트 리뉴얼' },
      { name: '해골 궁수', oldPath: 'legacy/summons/minion_skeleton_archer.png', newPath: '../assets/summons/minion_skeleton_archer.png', note: '신규 도트 스프라이트 리뉴얼' },
      { name: '해골 마법사', oldPath: 'legacy/summons/minion_skeleton_mage.png', newPath: '../assets/summons/minion_skeleton_mage.png', note: '신규 도트 스프라이트 리뉴얼' },
      { name: '제1군단장: 듀라한 아서', oldPath: 'legacy/summons/minion_death_knight.png', newPath: '../assets/summons/minion_arthur.png', note: '구 데스나이트 ➔ 아서 신규 제작' },
      { name: '외계 강습 드론', oldPath: null, newPath: '../assets/summons/minion_drone.png', note: '신규 추가 소환수' },
    ];

    const SKILL_COMPARES = [
      { id: 'necro_spear', name: '마력탄', oldVfx: 'legacy/pixel_vfx_skills/vfx_necro_1.png', newIcon: '../assets/skills/skill_necro_spear.png', newVfx: '../assets/skills/vfx/vfx_necro_spear.png' },
      { id: 'necro_bone_storm', name: '마력폭풍', oldVfx: 'legacy/pixel_vfx_skills/vfx_necro_2.png', newIcon: '../assets/skills/skill_necro_bone_storm.png', newVfx: '../assets/skills/vfx/vfx_necro_bone_storm.png' },
      { id: 'necro_legion', name: '해골 군단 소환', oldVfx: 'legacy/pixel_vfx_skills/vfx_necro_3.png', newIcon: '../assets/skills/skill_necro_legion.png', newVfx: null },
      { id: 'necro_lich_curse', name: '리치 군주의 저주구체', oldVfx: 'legacy/pixel_vfx_skills/vfx_necro_4.png', newIcon: '../assets/skills/skill_necro_lich_curse.png', newVfx: '../assets/skills/vfx/vfx_necro_lich_curse.png' },
      { id: 'necro_armor', name: '홀리 아머', oldVfx: 'legacy/pixel_vfx_skills/vfx_dk_1.png', newIcon: '../assets/skills/skill_necro_armor.png', newVfx: '../assets/skills/vfx/vfx_necro_armor.png' },
      { id: 'priest_sanctuary', name: '정화의 성염 장판', oldVfx: 'legacy/pixel_vfx_skills/vfx_priest_5.png', newIcon: '../assets/skills/skill_priest_sanctuary.png', newVfx: '../assets/skills/vfx/vfx_priest_sanctuary.png' },
      { id: 'dk_grip', name: '죽음의 손아귀', oldVfx: 'legacy/pixel_vfx_skills/vfx_dk_3.png', newIcon: '../assets/skills/skill_dk_grip.png', newVfx: '../assets/skills/vfx/vfx_dk_grip.png' },
      { id: 'psi_blackhole', name: '중력장 압축 (블랙홀)', oldVfx: 'legacy/pixel_vfx_skills/vfx_psi_5.png', newIcon: '../assets/skills/skill_psi_blackhole.png', newVfx: '../assets/skills/vfx/vfx_psi_blackhole.png' },
      { id: 'sm_dragon', name: '청룡참 검기', oldVfx: 'legacy/pixel_vfx_skills/vfx_sm_5.png', newIcon: '../assets/skills/skill_sm_dragon.png', newVfx: '../assets/skills/vfx/vfx_sm_dragon.png' },
      { id: 'ber_whirlwind', name: '중력 도끼 휠윈드', oldVfx: 'legacy/pixel_vfx_skills/vfx_ber_5.png', newIcon: '../assets/skills/skill_ber_whirlwind.png', newVfx: '../assets/skills/vfx/vfx_ber_whirlwind.png' },
      { id: 'sniper_shot', name: '대구경 관통 저격', oldVfx: 'legacy/pixel_vfx_skills/vfx_snip_5.png', newIcon: '../assets/skills/skill_sniper_shot.png', newVfx: '../assets/skills/vfx/vfx_sniper_shot.png' },
      { id: 'psi_drone', name: '외계 강습 드론', oldVfx: 'legacy/pixel_vfx_skills/vfx_psi_3.png', newIcon: '../assets/skills/skill_psi_drone.png', newVfx: '../assets/skills/vfx/vfx_psi_drone.png' },
      { id: 'storm_chain', name: '체인 라이트닝', oldVfx: 'legacy/pixel_vfx_skills/vfx_storm_5.png', newIcon: '../assets/skills/skill_storm_chain.png', newVfx: '../assets/skills/vfx/vfx_storm_chain.png' },
      { id: 'cryo_nova', name: '프로스트 노바', oldVfx: 'legacy/pixel_vfx_skills/vfx_cryo_5.png', newIcon: '../assets/skills/skill_cryo_nova.png', newVfx: '../assets/skills/vfx/vfx_cryo_nova.png' },
    ];

    const BRANCHES = [
      { name: '1. 무속성 계열', t1: 'necro_spear', t2: 'necro_bone_storm', pas: 'pas_frost_heart' },
      { name: '2. 사령속성 계열', t1: 'necro_legion', t2: 'necro_lich_curse', pas: 'pas_speed' },
      { name: '3. 성속성 계열', t1: 'necro_armor', t2: 'priest_sanctuary', pas: 'pas_iron_body' },
      { name: '4. 어둠속성 계열', t1: 'dk_grip', t2: 'psi_blackhole', pas: 'pas_blood_vamp' },
      { name: '5. 베기속성 계열', t1: 'sm_dragon', t2: 'ber_whirlwind', pas: 'pas_amount' },
      { name: '6. SF속성 계열', t1: 'sniper_shot', t2: 'psi_drone', pas: 'pas_hawk_eye' },
      { name: '7. 번개속성 계열', t1: 'storm_chain', t2: 'storm_thunder', pas: 'pas_thunder_wrath' },
      { name: '8. 빙결속성 계열', t1: 'cryo_snowball', t2: 'cryo_nova', pas: 'pas_cooldown' },
      { name: '9. 화염속성 계열', t1: 'fire_ball', t2: 'fire_storm', pas: 'pas_fire_staff' },
      { name: '10. 창술속성 계열', t1: 'spear_crimson', t2: 'spear_heaven', pas: 'pas_spear_spirit' },
    ];

    function assetUrl(p) { return '../' + p; }

    function openSkillModal(id) {
      const s = byId.get(id);
      if (!s) return;
      document.getElementById('modalIcon').src = assetUrl(s.icon);
      document.getElementById('modalTitle').textContent = s.name;
      const pasName = s.requiredPassiveId ? (byId.get(s.requiredPassiveId)?.name || s.requiredPassiveId) : '-';
      document.getElementById('modalMeta').textContent =
        `분류: ${s.category.toUpperCase()} | 방식: ${s.behavior} | 타겟: ${s.targeting}` +
        (s.requiredPassiveId ? ` | 짝꿍 패시브: ${pasName}` : '');

      let rows = s.levels.map(lv => `
        <tr>
          <td>Lv.${lv.level}</td>
          <td>${lv.description}</td>
          <td>${lv.damageCoeff ? (lv.damageCoeff * 100).toFixed(0) + '%' : '-'}</td>
          <td>${lv.cooldown ? lv.cooldown + 's' : '-'}</td>
          <td>${lv.projectileCount || '-'}</td>
        </tr>
      `).join('');

      document.getElementById('modalBody').innerHTML = `
        <table class="lv-table">
          <thead><tr><th>레벨</th><th>효과 설명</th><th>계수</th><th>쿨타임</th><th>개수</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
      document.getElementById('skillModal').classList.add('open');
    }

    document.getElementById('closeModal').onclick = () => document.getElementById('skillModal').classList.remove('open');
    document.getElementById('skillModal').onclick = (e) => {
      if (e.target.id === 'skillModal') document.getElementById('skillModal').classList.remove('open');
    };

    function renderCompare() {
      const minionHtml = MINION_COMPARES.map(m => `
        <div class="compare-card">
          <div class="compare-title">
            <span>${m.name}</span>
            <span class="compare-sub">${m.note}</span>
          </div>
          <div class="compare-boxes">
            <div class="compare-side old">
              <span class="badge-old">구버전 (기존)</span>
              ${m.oldPath ? `<img class="compare-img" src="${m.oldPath}" alt="구버전" />` : `<div style="height:72px; display:flex; align-items:center; color:var(--text-muted); font-size:0.78rem;">없음 (신규)</div>`}
            </div>
            <div class="compare-arrow">➔</div>
            <div class="compare-side new">
              <span class="badge-new">신규 제작 (운영중)</span>
              <img class="compare-img" src="${m.newPath}" alt="신규" />
            </div>
          </div>
        </div>
      `).join('');

      const skillHtml = SKILL_COMPARES.map(s => `
        <div class="compare-card" style="cursor:pointer;" onclick="openSkillModal('${s.id}')">
          <div class="compare-title">
            <span>${s.name}</span>
            <span class="compare-sub">클릭 시 상세 스탯</span>
          </div>
          <div class="compare-boxes">
            <div class="compare-side old">
              <span class="badge-old">구버전 (공용 VFX)</span>
              <div class="vfx-row">
                <img src="${s.oldVfx}" alt="구버전" />
              </div>
            </div>
            <div class="compare-arrow">➔</div>
            <div class="compare-side new">
              <span class="badge-new">신규 아이콘 + 인게임 VFX</span>
              <div class="vfx-row">
                <img src="${s.newIcon}" title="UI 아이콘" alt="아이콘" />
                ${s.newVfx ? `<img src="${s.newVfx}" title="인게임 전투 VFX" alt="인게임 VFX" />` : ''}
              </div>
            </div>
          </div>
        </div>
      `).join('');

      const heroHtml = `
        <div class="compare-card">
          <div class="compare-title">
            <span>사령군주 최미남 (Hero)</span>
            <span class="compare-sub">16비트 정통 도트 리마스터</span>
          </div>
          <div class="compare-boxes">
            <div class="compare-side old">
              <span class="badge-old">구버전 (벡터)</span>
              <img class="compare-img" src="legacy/agents/agent_male_nemesis.png" alt="구버전 영웅" />
            </div>
            <div class="compare-arrow">➔</div>
            <div class="compare-side new">
              <span class="badge-new">16비트 도트 (운영중)</span>
              <img class="compare-img" src="../assets/agents/agent_male_nemesis.png" alt="신규 영웅" />
            </div>
          </div>
        </div>
      `;

      const bgHtml = (D.regions || []).slice(0, 14).map((r, i) => {
        const idx = i + 1;
        return `
          <div class="compare-card">
            <div class="compare-title">
              <span>${idx}지역 · ${r.name}</span>
              <span class="compare-sub">전투 &amp; 거점 배경</span>
            </div>
            <div class="compare-boxes">
              <div class="compare-side old">
                <span class="badge-old">구버전</span>
                <div class="vfx-row">
                  <img style="width:78px;height:44px;" src="legacy/ui/regions/battle_bg_${idx}.png" alt="구 전투배경" />
                  <img style="width:78px;height:44px;" src="legacy/ui/regions/town_bg_${idx}.png" alt="구 거점배경" />
                </div>
              </div>
              <div class="compare-arrow">➔</div>
              <div class="compare-side new">
                <span class="badge-new">16비트 리마스터</span>
                <div class="vfx-row">
                  <img style="width:78px;height:44px;" src="../assets/ui/regions/battle_bg_${idx}.png" alt="신 전투배경" />
                  <img style="width:78px;height:44px;" src="../assets/ui/regions/town_bg_${idx}.png" alt="신 거점배경" />
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="section-title"><span>🧙‍♂️ 영웅 &amp; 💀 소환수 군단: 구버전 vs 신규 16비트 도트 비교</span></div>
        <div class="compare-grid">${heroHtml}${minionHtml}</div>
        <div class="section-title"><span>⚔️ 스킬 아이콘 &amp; 인게임 VFX: 구버전 vs 신규 제작본 비교</span></div>
        <div class="compare-grid">${skillHtml}</div>
        <div class="section-title"><span>🗺️ 1~14지역 전투 · 거점 배경: 구버전 vs 16비트 리마스터 비교</span></div>
        <div class="compare-grid">${bgHtml}</div>
      `;
    }

    function renderBranches() {
      const html = BRANCHES.map(b => {
        const s1 = byId.get(b.t1);
        const s2 = byId.get(b.t2);
        const pas = byId.get(b.pas);
        const awks = D.awakenedSkills.filter(a => a.evolvesFrom === b.t1 || a.evolvesFrom === b.t2);

        return `
          <div class="branch-card">
            <div class="branch-header">
              <div class="branch-name">${b.name}</div>
              <div class="branch-tag">최대 3계열 선택 가능</div>
            </div>
            <div class="tree-row">
              <div class="skill-mini" onclick="openSkillModal('${s1.id}')">
                <div class="skill-mini-top">
                  <img class="skill-icon" src="${assetUrl(s1.icon)}" alt="${s1.name}" />
                  <div>
                    <div class="skill-title">${s1.name}</div>
                    <div class="skill-sub">하위 (Lv.1~5)</div>
                  </div>
                </div>
              </div>
              <div class="skill-mini" onclick="openSkillModal('${s2.id}')">
                <div class="skill-mini-top">
                  <img class="skill-icon" src="${assetUrl(s2.icon)}" alt="${s2.name}" />
                  <div>
                    <div class="skill-title">${s2.name}</div>
                    <div class="skill-sub">상위 (하위 Lv.3 해금)</div>
                  </div>
                </div>
              </div>
              <div class="skill-mini" onclick="openSkillModal('${pas.id}')">
                <div class="skill-mini-top">
                  <img class="skill-icon" src="${assetUrl(pas.icon)}" alt="${pas.name}" />
                  <div>
                    <div class="skill-title">${pas.name}</div>
                    <div class="skill-sub">짝꿍 패시브 (상자)</div>
                  </div>
                </div>
              </div>
            </div>
            <div class="awakened-strip">
              ${awks.map(a => `
                <div class="awk-pill" onclick="openSkillModal('${a.id}')">
                  <img src="${assetUrl(a.icon)}" alt="${a.name}" />
                  <span>각성: ${a.name}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="section-title">
          <span>⚔️ 현재 운영중 10개 스킬 계열 트리</span>
          <span style="font-size:0.8rem; color:var(--text-muted);">일반 레벨업: 액티브 전용 / 상자: 패시브 &amp; 각성</span>
        </div>
        <div class="branch-grid">${html}</div>
      `;
    }

    function renderPassives() {
      const pHtml = D.passiveSkills.map(p => `
        <div class="item-card" style="cursor:pointer;" onclick="openSkillModal('${p.id}')">
          <div class="item-card-head">
            <img class="sprite" src="${assetUrl(p.icon)}" alt="${p.name}" />
            <div>
              <div class="item-name">${p.name}</div>
              <div class="item-meta">패시브 Lv.1~5</div>
            </div>
          </div>
          <div class="item-desc">Lv.1: ${p.levels[0].description}</div>
          <div class="item-desc" style="color:var(--neon-green);">Lv.5: ${p.levels[4].description}</div>
        </div>
      `).join('');

      const aHtml = D.awakenedSkills.map(a => {
        const fromName = byId.get(a.evolvesFrom)?.name || a.evolvesFrom;
        const pasName = byId.get(a.requiredPassiveId)?.name || a.requiredPassiveId;
        return `
          <div class="item-card" style="cursor:pointer; border-color:var(--neon-purple);" onclick="openSkillModal('${a.id}')">
            <div class="item-card-head">
              <img class="sprite" src="${assetUrl(a.icon)}" alt="${a.name}" />
              <div>
                <div class="item-name" style="color:#ebb5ff;">${a.name}</div>
                <div class="item-meta">${fromName} Lv.5 + ${pasName}</div>
              </div>
            </div>
            <div class="item-desc">${a.levels[0].description}</div>
          </div>
        `;
      }).join('');

      return `
        <div class="section-title"><span>💎 패시브 스킬 (${D.passiveSkills.length}종)</span></div>
        <div class="card-grid" style="margin-bottom:24px;">${pHtml}</div>
        <div class="section-title"><span>🌟 각성 스킬 (${D.awakenedSkills.length}종)</span></div>
        <div class="card-grid">${aHtml}</div>
      `;
    }

    function renderRegions() {
      const html = D.regions.map(r => `
        <div class="region-card">
          <div class="region-top">
            <div>
              <div style="color:var(--neon-gold); font-size:1rem;">${r.regionId}지역. ${r.name}</div>
              <div style="color:var(--neon-cyan); font-size:0.8rem;">게이트: ${r.gateName} · 기본 HP ${r.baseEnemyHp} / ATK ${r.baseEnemyAtk}</div>
            </div>
            <div class="region-bgs">
              <img src="../assets/ui/gates/gate_${r.gateType}.png" alt="${r.gateName}" style="width:54px; object-fit:contain;" />
              <img src="../assets/ui/regions/town_bg_${r.regionId}.png" alt="거점 배경" />
              <img src="../assets/ui/regions/battle_bg_${r.regionId}.png" alt="전투 배경" />
            </div>
          </div>
          <div class="monster-row">
            ${r.monsters.map((mName, idx) => `
              <div class="monster-box">
                <img src="../assets/monsters/m_${r.regionId}_${idx + 1}.png" alt="${mName}" />
                <div class="monster-role">일반 ${idx + 1}</div>
                <div class="monster-name">${mName}</div>
              </div>
            `).join('')}
            <div class="monster-box named">
              <img src="../assets/monsters/m_${r.regionId}_named.png" alt="${r.named}" />
              <div class="monster-role" style="color:var(--neon-orange);">네임드</div>
              <div class="monster-name">${r.named}</div>
            </div>
            <div class="monster-box boss">
              <img src="../assets/monsters/m_${r.regionId}_boss.png" alt="${r.boss}" />
              <div class="monster-role" style="color:var(--neon-pink);">지역 보스</div>
              <div class="monster-name">${r.boss}</div>
            </div>
          </div>
        </div>
      `).join('');

      return `<div class="section-title"><span>🗺️ 14개 지역 게이트 &amp; 84종 괴수 도감</span></div>${html}`;
    }

    function renderAltar() {
      const renderGroup = (title, items) => `
        <div class="section-title"><span>${title} (${items.length}종)</span></div>
        <div class="card-grid" style="margin-bottom:22px;">
          ${items.map(it => `
            <div class="item-card">
              <div class="item-name">${it.name}</div>
              <div class="item-meta">최대 Lv.${it.maxLevel} · 기본 비용 ${it.baseCost}</div>
              <div class="item-desc">${it.description}</div>
            </div>
          `).join('')}
        </div>
      `;
      return (
        renderGroup('⚔️ 전투 특성 (Combat Traits)', D.combatTraits) +
        renderGroup('🛡️ 생존 재능 (Survival Talents)', D.survivalTraits) +
        renderGroup('🕯️ 회귀 영혼 각인 (Legacy Soul Imprints)', D.legacyAltarItems)
      );
    }

    const panel = document.getElementById('contentPanel');
    const renderers = { compare: renderCompare, branches: renderBranches, passives: renderPassives, regions: renderRegions, altar: renderAltar };

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        panel.innerHTML = renderers[btn.dataset.tab]();
      };
    });

    panel.innerHTML = renderCompare();
  </script>
</body>
</html>
