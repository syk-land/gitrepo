<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>목적을 잃지 않는 사령군주 : 서바이버즈 (2D 뱀서류 RPG)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Gowun+Batang:wght@400;700&display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }
      html, body {
        width: 100%;
        height: 100dvh;
        background-color: #0c0908;
        background-image: radial-gradient(circle at 50% 20%, #241914 0%, #0c0908 100%);
        color: #f5ede2;
        font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #app {
        width: 360px;
        height: 640px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        border: 1px solid rgba(212, 163, 56, 0.35);
        box-shadow: 0 0 45px rgba(0, 0, 0, 0.9), 0 0 24px rgba(212, 163, 56, 0.14);
        transition: width 0.15s ease, height 0.15s ease;
      }
      /* Laptop / Medium (450x800) */
      @media (min-width: 480px) and (min-height: 840px) {
        #app {
          width: 450px;
          height: 800px;
        }
      }
      /* Desktop Large (540x960 원본) */
      @media (min-width: 580px) and (min-height: 1000px) {
        #app {
          width: 540px;
          height: 960px;
        }
      }
      /* Mobile (작은 화면 대응) */
      @media (max-width: 479px), (max-height: 660px) {
        #app {
          width: 100vw;
          height: 100dvh;
          max-width: 360px;
          max-height: 640px;
          border: none;
          box-shadow: none;
        }
      }
      canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        image-rendering: auto !important;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
