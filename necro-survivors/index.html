<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0908" />
    <title>Necro Survivors: Undead Horde</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;600;700&display=swap" />
    <script>
      window.SDK_OPTIONS = {
        gameId: 'u54rb9xyxouao1s1ztn3dwsk46ubn2co',
        onEvent: function (a) {
          if (a && typeof a.name === 'string') {
            window.dispatchEvent(new CustomEvent('gm-sdk-event', { detail: a }));
            
          }
        },
      };
      (function () {
        var host = (window.location && window.location.hostname) || '';
        var s = document.createElement('script');
        s.async = true;
        if (/yandex/i.test(host)) {
          s.id = 'yandex-games-sdk';
          s.src = '/sdk.js';
          s.onload = function () {
            if (window.YaGames && typeof window.YaGames.init === 'function') {
              window.YaGames.init().then(function (ysdk) {
                window.__ysdk = ysdk;
                try { ysdk.features && ysdk.features.LoadingAPI && ysdk.features.LoadingAPI.ready(); } catch (e) {}
                window.dispatchEvent(new CustomEvent('gm-sdk-event', { detail: { name: 'SDK_READY' } }));
              }).catch(function () {});
            }
          };
        } else {
          s.id = 'gamemonetize-sdk';
          s.src = 'https://api.gamemonetize.com/sdk.js';
        }
        document.head.appendChild(s);
        window.addEventListener('click', function () {
          if (window.__gmPrerollDone) return;
          if (window.sdk && typeof window.sdk.showBanner === 'function') {
            window.__gmPrerollDone = true;
            try { window.sdk.showBanner(); } catch (e) {}
          } else if (typeof window.ShowAds === 'function') {
            window.__gmPrerollDone = true;
            try { window.ShowAds(); } catch (e) {}
          }
        }, { passive: true });
      })();
    </script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }
      :root {
        color-scheme: only dark;
      }
      html, body {
        width: 100%;
        height: 100dvh;
        background-color: #0c0908;
        background-image: radial-gradient(circle at 50% 20%, #241914 0%, #0c0908 100%);
        color: #f5ede2;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #app {
        width: 360px;
        height: 640px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        border: 1px solid rgba(212, 163, 56, 0.35);
        box-shadow: 0 0 45px rgba(0, 0, 0, 0.9), 0 0 24px rgba(212, 163, 56, 0.14);
        transition: width 0.15s ease, height 0.15s ease;
      }
      /* Laptop / Medium (450x800) */
      @media (min-width: 480px) and (min-height: 840px) {
        #app {
          width: 450px;
          height: 800px;
        }
      }
      /* Desktop Large (540x960 원본) */
      @media (min-width: 580px) and (min-height: 1000px) {
        #app {
          width: 540px;
          height: 960px;
        }
      }
      /* Mobile (작은 화면 대응) */
      @media (max-width: 479px), (max-height: 660px) {
        #app {
          width: 100vw;
          height: 100dvh;
          max-width: 360px;
          max-height: 640px;
          border: none;
          box-shadow: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app {
          transition: none;
        }
      }
      canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        image-rendering: pixelated !important;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script src="./tutorial.js"></script>
  </body>
</html>
